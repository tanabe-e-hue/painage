<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Look to Learn - パイ投げゲーム</title>
  <!-- 視線追跡ライブラリ WebGazer.js -->
  <script src="https://webgazer.cs.brown.edu/webgazer.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #000000; /* 背景を黒に設定 */
      color: #ffffff;
      font-family: sans-serif;
      touch-action: none;
    }
    #info-bar {
      position: absolute;
      top: 15px;
      left: 20px;
      font-size: 24px;
      font-weight: bold;
      z-index: 100;
      color: #ffffff;
    }
    .target {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 10cm;
      height: 12cm;
      background-color: #ffffff; /* 的の中身を白に設定 */
      border-radius: 20px; 
      font-size: 5.5cm;
      display: flex;
      justify-content: center;
      align-items: center;
      box-sizing: border-box;
      user-select: none;
      transition: opacity 0.3s ease;
      cursor: pointer;
      overflow: hidden; /* ゲージが的からはみ出ないように */
    }
    #target-left { left: calc(10% + 2cm); }
    #target-right { right: calc(10% + 2cm); }

    /* ゲージ（タイマー）演出 */
    .progress-ring {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border-radius: 20px;
      border: 15px solid transparent;
      box-sizing: border-box;
      pointer-events: none;
    }
    /* 注視・カーソルホバー中の演出 */
    .gazing .progress-ring {
      border-color: #ff3333; 
      animation: fillProgress 2s linear forwards;
    }
    /* 的の下から上へ赤色が満たされていくアニメーション */
    @keyframes fillProgress {
      0% { clip-path: inset(100% 0 0 0); }
      100% { clip-path: inset(0 0 0 0); }
    }

    /* パイの演出 */
    .pie {
      position: absolute;
      font-size: 110px;
      z-index: 50;
      transition: all 0.4s ease-in-out;
      pointer-events: none;
    }
    
    /* 非表示状態 */
    .hidden {
      display: none !important;
    }

    /* カテゴリ選択画面・クリア画面のオーバーレイ */
    .overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.95);
      z-index: 200;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .overlay h1 {
      font-size: 40px;
      margin-bottom: 30px;
      color: #ffffff;
    }

    .category-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      width: 80%;
      max-width: 600px;
    }

    .btn {
      background-color: #333333;
      color: #ffffff;
      border: 3px solid #ffffff;
      border-radius: 15px;
      padding: 20px;
      font-size: 28px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
    }

    .btn:hover {
      background-color: #ff69b4;
      color: #ffffff;
      transform: scale(1.05);
    }

    #clear-screen h1 {
      color: #ff69b4;
      font-size: 48px;
    }

    #next-stage-btn {
      margin-top: 30px;
      background-color: #ff3333;
    }
  </style>
</head>
<body>

  <div id="info-bar">成功: <span id="score">0</span> / 5</div>
  
  <!-- 左の的 -->
  <div id="target-left" class="target hidden">
    <div class="progress-ring"></div>
    <span class="icon">🍎</span>
  </div>
  
  <!-- 右の的 -->
  <div id="target-right" class="target hidden">
    <div class="progress-ring"></div>
    <span class="icon">🍌</span>
  </div>

  <!-- スタート／ステージ選択画面 -->
  <div id="start-screen" class="overlay">
    <h1>あそぶステージをえらんでね</h1>
    <div class="category-buttons">
      <button class="btn" onclick="selectCategory('fruits')">🍎 くだもの</button>
      <button class="btn" onclick="selectCategory('animals')">🐶 どうぶつ</button>
      <button class="btn" onclick="selectCategory('vegetables')">🥦 やさい</button>
      <button class="btn" onclick="selectCategory('vehicles')">🚗 のりもの</button>
    </div>
  </div>

  <!-- クリア画面 -->
  <div id="clear-screen" class="overlay hidden">
    <h1>🎉 おめでとう！クリア！ 🎉</h1>
    <button id="next-stage-btn" class="btn" onclick="showCategorySelect()">つぎのステージへ</button>
  </div>

  <script>
    let score = 0;
    const maxScore = 5;
    let currentActiveTarget = null;
    let gazeTimer = null;
    let isHit = false;
    let isGameActive = false;

    // 現在表示されている位置（'left' または 'right'）
    let currentPosition = 'left';

    // 出現させる要素のカテゴリ定義
    const categories = {
      fruits: ['🍎', '🍌', '🍊', '🍇', '🍓', '🍑', '🍍', '🍈'],
      animals: ['🐶', '🐱', '🐰', '🦊', '🐻', '🐼', '🦁', '🐯'],
      vegetables: ['🥦', '🥕', '🌽', '🍅', '茄', '🥬', '🍠', '🫑'],
      vehicles: ['🚗', '🚃', '✈️', '🚀', '🚢', '🚁', '🚲', '🚑']
    };

    let currentCategoryList = categories.fruits;

    window.onload = async () => {
      // 1. マウスカーソル用のイベントリスナー設定
      setupMouseEvents();

      // 2. WebGazer（視線追跡）の初期化
      try {
        await webgazer.setRegression('ridge')
          .setGazeListener((data, elapsedTime) => {
            if (!isGameActive || data == null || isHit || score >= maxScore) return;
            
            const x = data.x;
            const y = data.y;

            checkGaze(x, y);
          })
          .saveDataAcrossSessions(true)
          .begin();

        webgazer.showVideoPreview(true)
                 .showPredictionPoints(true);
      } catch (e) {
        console.log("WebGazerの読み込みをスキップ、またはカメラ非対応環境です");
      }
    };

    // カテゴリ選択とゲームのスタート処理
    function selectCategory(categoryKey) {
      currentCategoryList = categories[categoryKey];
      
      // スコアのリセット
      score = 0;
      document.getElementById('score').innerText = score;
      isHit = false;

      // 画面の表示切り替え
      document.getElementById('start-screen').classList.add('hidden');
      document.getElementById('clear-screen').classList.add('hidden');

      // 的の初期表示
      currentPosition = 'left';
      const leftElem = document.getElementById('target-left');
      const rightElem = document.getElementById('target-right');
      
      leftElem.querySelector('.icon').innerText = getRandomIcon();
      leftElem.classList.remove('hidden');
      rightElem.classList.add('hidden');

      if (typeof webgazer !== 'undefined') webgazer.resume();
      isGameActive = true;
    }

    // ステージ選択（スタート）画面に戻る処理
    function showCategorySelect() {
      isGameActive = false;
      resetTimer();
      document.getElementById('target-left').classList.add('hidden');
      document.getElementById('target-right').classList.add('hidden');
      document.getElementById('clear-screen').classList.add('hidden');
      document.getElementById('start-screen').classList.remove('hidden');
    }

    // アイコンのランダム選出
    function getRandomIcon(excludeIcon = '') {
      let icon;
      do {
        icon = currentCategoryList[Math.floor(Math.random() * currentCategoryList.length)];
      } while (icon === excludeIcon && currentCategoryList.length > 1);
      return icon;
    }

    // マウスカーソルのホバーイベントを設定
    function setupMouseEvents() {
      const targets = document.querySelectorAll('.target');
      targets.forEach(target => {
        target.addEventListener('mouseenter', () => {
          if (!isGameActive || isHit || score >= maxScore || target.classList.contains('hidden')) return;
          startTargetTimer(target);
        });

        target.addEventListener('mouseleave', () => {
          if (currentActiveTarget === target) {
            resetTimer();
          }
        });
      });
    }

    // 視線座標（WebGazer）による判定
    function checkGaze(x, y) {
      const activeElem = currentPosition === 'left' 
        ? document.getElementById('target-left') 
        : document.getElementById('target-right');

      if (activeElem.classList.contains('hidden')) return;

      const rect = activeElem.getBoundingClientRect();

      if (isInside(x, y, rect)) {
        if (currentActiveTarget !== activeElem) {
          startTargetTimer(activeElem);
        }
      } else if (currentActiveTarget && !isMouseOver(currentActiveTarget)) {
        resetTimer();
      }
    }

    // タイマー開始処理の共通化
    function startTargetTimer(target) {
      resetTimer();
      currentActiveTarget = target;
      currentActiveTarget.classList.add('gazing');
      
      // 2秒間の注視・ホバータイマー開始
      gazeTimer = setTimeout(() => {
        throwPie(currentActiveTarget);
      }, 2000);
    }

    function isInside(x, y, rect) {
      return x >= rect.left && x <= rect.right && y >= rect.top && y <= rect.bottom;
    }

    function isMouseOver(element) {
      return element.matches(':hover');
    }

    function resetTimer() {
      if (gazeTimer) {
        clearTimeout(gazeTimer);
        gazeTimer = null;
      }
      if (currentActiveTarget) {
        currentActiveTarget.classList.remove('gazing');
        currentActiveTarget = null;
      }
    }

    // パイ投げアニメーション ＆ 消去・もう片方の的へシフトする処理
    function throwPie(targetElem) {
      isHit = true;
      resetTimer();

      const rect = targetElem.getBoundingClientRect();
      const pie = document.createElement('div');
      pie.className = 'pie';
      pie.innerHTML = '🥧';
      
      // 画面下中央から発射
      pie.style.left = '50%';
      pie.style.top = '100%';
      document.body.appendChild(pie);

      // 的の中心に着弾するようにパイの位置を計算
      setTimeout(() => {
        pie.style.left = `${rect.left + rect.width / 2 - 55}px`;
        pie.style.top = `${rect.top + rect.height / 2 - 55}px`;
      }, 50);

      // ヒット演出と切り替え
      setTimeout(() => {
        pie.innerHTML = '💥';
        
        // 1. 現在の的を消す
        targetElem.classList.add('hidden');

        score++;
        document.getElementById('score').innerText = score;

        setTimeout(() => {
          pie.remove();

          if (score >= maxScore) {
            isGameActive = false;
            document.getElementById('clear-screen').classList.remove('hidden');
            if (typeof webgazer !== 'undefined') webgazer.pause();
          } else {
            // 2. もう片方の位置に新しい的を表示
            switchToNextTarget();
            isHit = false;
          }
        }, 600);
      }, 450);
    }

    // 左右交互に新しい的を表示する関数
    function switchToNextTarget() {
      currentPosition = (currentPosition === 'left') ? 'right' : 'left';
      
      const nextElem = currentPosition === 'left' 
        ? document.getElementById('target-left') 
        : document.getElementById('target-right');

      const iconSpan = nextElem.querySelector('.icon');
      
      // 前回のアイコンと被らないようにランダム選出
      const currentIcon = document.querySelector('.target:not(.hidden) .icon')?.innerText;
      iconSpan.innerText = getRandomIcon(currentIcon);
      
      // 表示
      nextElem.classList.remove('hidden');
    }
  </script>
</body>
</html>
